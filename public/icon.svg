<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle for Android -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Inner glowing ring -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Cloud Base -->
  <g filter="url(#shadow)">
    <!-- Cloud Path -->
    <path d="M380 340 C420 340 450 310 450 270 C450 232 422 202 385 200 C375 145 325 105 265 105 C215 105 172 135 152 178 C144 175 136 174 128 174 C84 174 48 210 48 254 C48 298 84 334 128 334 L380 334 Z" fill="url(#cloudGrad)" opacity="0.95"/>

    <!-- Telegram Paper Plane Icon inside Cloud -->
    <path d="M205 305 L200 365 C207 365 210 362 214 358 L248 325 L318 376 C331 383 340 379 344 364 L390 148 C395 128 382 119 369 124 L100 228 C80 236 80 248 97 253 L166 274 L326 173 C334 168 340 171 334 176 L205 305 Z" fill="#0284c7"/>
  </g>
</svg>
